# viewer_config.yaml
# Viewer-only display settings for the 3D waypoint viewer.
# Edit this if your RoboDK world coordinate origin changes relative to Rhino.
#
# world_origin: RoboDK world origin expressed in RoboDK world space.
#               Almost always (0,0,0). Change only if your station has a
#               non-zero world frame offset.
#
# robot_base_world lives in path_config.yaml (it is needed for path planning,
# not just display). The viewer reads it from there automatically.

world_origin:
  x: 0.0
  y: 0.0
  z: 0.0
