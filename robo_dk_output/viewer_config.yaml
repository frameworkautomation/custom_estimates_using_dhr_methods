# viewer_config.yaml
# Origin markers shown in the 3D waypoint viewer.
# Edit these if your RoboDK station coordinate system changes.
#
# world_origin:   RoboDK world origin in RoboDK world space (almost always 0,0,0)
# robot_base_world: position of robot arm base in RoboDK world space.
#                 Auto-updated by save_joint_position.py whenever a waypoint is saved.

world_origin:
  x: 0.0
  y: 0.0
  z: 0.0

robot_base_world:
  x: 0.0
  y: 0.0
  z: 0.0
